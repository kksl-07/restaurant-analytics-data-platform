name: "restaurant_analytics_data_platform"
version: "1.0.0"
config-version: 2

profile: "restaurant_analytics_data_platform"

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

log-path: "logs"
target-path: "target"

vars:
  raw_data_path: "{{ env_var('RAW_DATA_PATH', '/app/data/raw') }}"
  cleaned_data_path: "{{ env_var('CLEANED_DATA_PATH', '/app/exports/cleaned') }}"
  marts_data_path: "{{ env_var('MARTS_DATA_PATH', '/app/exports/marts') }}"

models:
  restaurant_analytics_data_platform:
    staging:
      +materialized: view
    public:
      +materialized: table
    marts:
      +materialized: table