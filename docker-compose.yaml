x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/

    AIRFLOW__API_AUTH__JWT_SECRET: "restaurant-analytics-local-jwt-secret"
    AIRFLOW__API__SECRET_KEY: "restaurant-analytics-local-api-secret"

    # Restaurant analytics runtime
    DBT_PROFILES_DIR: /opt/restaurant-platform/profiles
    DUCKDB_PATH: /opt/restaurant-platform/.duckdb/local.duckdb
    RAW_DATA_PATH: /opt/restaurant-platform/data/raw
    CLEANED_DATA_PATH: /opt/restaurant-platform/exports/cleaned
    MARTS_DATA_PATH: /opt/restaurant-platform/exports/marts

  volumes:
    # Airflow
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config

    # Restaurant analytics platform
    - ./data:/opt/restaurant-platform/data
    - ./exports:/opt/restaurant-platform/exports
    - ./.duckdb:/opt/restaurant-platform/.duckdb
    - ./models:/opt/restaurant-platform/models
    - ./scripts:/opt/restaurant-platform/scripts
    - ./profiles:/opt/restaurant-platform/profiles
    - ./tests:/opt/restaurant-platform/tests
    - ./logs:/opt/restaurant-platform/logs
    - ./target:/opt/restaurant-platform/target
    - ./dbt_project.yml:/opt/restaurant-platform/dbt_project.yml
  depends_on:
    postgres:
      condition: service_healthy


services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5


  airflow-init:
    <<: *airflow-common

    command:
      - bash
      - -c
      - airflow db migrate

    restart: "no"


  airflow-api-server:
    <<: *airflow-common

    command: api-server

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


volumes:
  airflow_postgres_data: